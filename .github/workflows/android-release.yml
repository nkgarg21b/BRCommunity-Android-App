name: Android Release
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode
        required: true
        default: '1'
      version_name:
        description: Android versionName
        required: true
        default: '1.0.0'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
      EXPO_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: '0.05'
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate production configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$SENTRY_ORG"
          test -n "$SENTRY_PROJECT"
          test -n "$SENTRY_AUTH_TOKEN"
          test -n "$EXPO_PUBLIC_SENTRY_DSN"
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-upload.jks
      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: ./scripts/build-android-release.sh
      - name: Verify AAB identity
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/bundle/release/app-release.aab
          unzip -p android/app/build/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml | strings | grep -q 'com.brcommunity.androidhelper'
      - uses: actions/upload-artifact@v4
        with:
          name: brcommunity-android-helper-${{ inputs.version_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Remove signing material
        if: always()
        run: rm -f android/release-upload.jks
